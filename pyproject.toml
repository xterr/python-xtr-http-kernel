[project]
name = "xtr-http-kernel"
version = "2.0.0"
description = "Requests turned into responses through events: a request lifecycle for FastAPI applications on the xtr kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["http", "kernel", "request", "lifecycle", "events", "middleware", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# This package *is* the web integration, so unlike every other library here it
# takes the container layer and the web framework outright rather than behind
# an extra: there is nothing left of it once either is gone.
dependencies = [
    "fastapi>=0.121.3",
    # Imported directly — requests, responses, middleware — not only through fastapi.
    "starlette>=0.40",
    "xtr-dependency-injection[fastapi]>=2.0,<3",
    "xtr-event-dispatcher>=2.0,<3",
    "xtr-event-dispatcher-contracts>=2.0,<3",
    "xtr-logging-contracts>=2.0,<3",
    "xtr-service-contracts>=2.0,<3",
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
logging = [
    "xtr-logging>=2.0,<3",
]
console = [
    "xtr-console>=2.0,<3",
]
rate-limiter = [
    "xtr-clock>=2.0,<3",
    "xtr-rate-limiter[di]>=2.0,<3",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
http_kernel = "xtr_http_kernel.bundle:HttpKernelBundle"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "xtr-logging>=2.0,<3",
    "xtr-console>=2.0,<3",
    "xtr-clock>=2.0,<3",
    "xtr-rate-limiter[di]>=2.0,<3",
    # Requests are driven straight at the application through an ASGI
    # transport, so the suite never binds a socket.
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# `@override` landed in typing in 3.12; on 3.11 we import from typing_extensions
# only when the class actually derives from a base with matching methods.
reportImplicitOverride = "none"
# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field. See xtr_http_kernel/exception/.
    "TRY003",
    "EM101",
    "EM102",
    # The logging contract takes a context mapping, not the standard
    # library's format arguments; PLE1205 reads one as the other.
    "PLE1205",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "TC002",   # pytest is imported at runtime for markers even without type use
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
